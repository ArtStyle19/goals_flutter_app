name: productivity
description: "Productivity Planner - Flutter App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Database (Drift)
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.5
  path: ^1.9.0

  # Code Generation (annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI
  shimmer: ^3.0.0
  table_calendar: ^3.2.0
  flutter_slidable: ^3.1.1

  # Sharing / Export
  share_plus: ^11.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7

  # Connectivity
  connectivity_plus: ^6.1.3

  # Icons
  cupertino_icons: ^1.0.8
  flutter_timezone: ^5.0.1

  # Environment Variables
  flutter_dotenv: ^5.1.2
  google_fonts: ^8.0.1
  rename: ^3.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.15.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
